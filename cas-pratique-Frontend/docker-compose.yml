services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - bookstore-net

  loopback-bookstore:
    build: ./loopback-bookstore
    image: loopback-bookstore-img
    container_name: loopback-bookstore
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      MONGODB_URL: mongodb://mongo:27017/bookstore
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bookstore-net

  bookstore-web-app:
    build: ./bookstore-web-app
    image: bookstore-web-app-img
    container_name: bookstore-web-app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      API_URL: http://loopback-bookstore:3000
    depends_on:
      - loopback-bookstore
    networks:
      - bookstore-net

networks:
  bookstore-net:
    driver: bridge

volumes:
  mongo-data:
